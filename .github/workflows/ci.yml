name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 버전의 단일 기준은 .nvmrc — 로컬·CI·배포가 같은 버전을 쓴다
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 빌드
        run: npm run build

      - name: 빌드 용량 검사 (15MB 게이트, G2)
        run: npm run check:size

      # 신 스코프 가드 (6차 결의 2 — 업그레이드 7·장비 4·보스 1·해역 1).
      # --strict = 위반 시 실패. 회의 문언은 '경고'라 완화 여부는 리드 결정
      # 대기 (INTEGRATION_NOTES INT-TOOL-006) — 완화 시 --strict 제거.
      - name: 신 스코프 가드 검사 [LOOP]
        run: npm run check:scope -- --strict

      - name: 툴링 결정적 검증 (세이브·업그레이드·Keyboard Lock 폴백)
        run: npm run verify:tooling

      - name: 게임플레이 결정적 검증
        run: npm run verify:gameplay

      - name: 메타 루프 결정적 검증 [LOOP]
        run: npm run verify:meta

      # 스프린트 A 인수 검증 — A1~A8 + A5-T1~T6 + 문서 회귀(§8).
      # 타 창 미병합 항목은 '수동 확인' 구역으로 분리 출력되며 종료 코드에
      # 반영되지 않는다 (회의 14 결의 3: 판정은 dev 통합 빌드에서).
      #
      # continue-on-error: A 미통과는 '아직 다른 창이 병합되지 않았다'는 정상
      # 상태이기도 하므로, 현 시점에 이 단계로 전 파트의 CI를 막지 않는다.
      # 스프린트 A 통과 판정 권한은 통합 창에 있다 — 통합 창이 dev에서 이
      # 명령을 돌려 전 항목 통과를 확인한 뒤 통합 PR을 연다.
      # 차단으로 승격할지는 리드 결정 (INTEGRATION_NOTES INT-TOOL-008).
      - name: 스프린트 A 인수 검증 [LOOP][ECON]
        continue-on-error: true
        run: npm run verify:sprint-a

      # ── M1·M2 Runtime Closure (INT-CORE-022) ───────────────────
      # 병렬 개발 단계에서 그래픽스 world 파일(bossCluePlacements)과
      # Game.ts production 배선이 아직 없다. 그 blocked·unwired 상태로는
      # CI를 실패시키지 않는다 — 러너가 그 둘을 종료 코드에서 제외하고,
      # **verifier 오류·계약 위반·잘못된 pass 승격만** exit 1로 낸다.
      # production Exit gate는 최종 통합 단계에서만 강제한다.
      - name: 스프린트 B 인수 검증 [FACTION]
        continue-on-error: true
        run: npm run verify:sprint-b

      - name: 스프린트 C 인수 검증 [COMBAT]
        continue-on-error: true
        run: npm run verify:sprint-c

      - name: M1·M2 Runtime Closure 검증 [BOSS][LOOP]
        run: npm run verify:runtime-closure

      - name: Runtime Closure 상태 JSON 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-closure-status
          path: docs/measurements/runtime-closure-status.json
          if-no-files-found: warn
